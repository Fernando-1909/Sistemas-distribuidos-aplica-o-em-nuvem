<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e4b5a"/></marker>
    <marker id="setaMarca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d3366a"/></marker>
  </defs>
  <rect width="980" height="600" fill="#fffaf6"/>
  <text x="30" y="34" font-size="18" font-weight="700" fill="#2b1d29">Módulo 4 · Mensageria (implementada) × Streaming de eventos (proposta)</text>

  <!-- ============ MENSAGERIA ============ -->
  <text x="30" y="78" font-size="13" font-weight="700" fill="#d3366a">MENSAGERIA · RabbitMQ · implementada neste repositório</text>
  <rect x="30" y="95" width="250" height="120" rx="12" fill="#ffffff" stroke="#2b1d29" stroke-width="2"/>
  <text x="155" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#d3366a">PRODUTOR</text>
  <text x="155" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#2b1d29">tasks-service</text>
  <text x="155" y="173" text-anchor="middle" font-size="12" fill="#6b5a68">publica "tarefa concluída"</text>
  <text x="155" y="190" text-anchor="middle" font-size="12" fill="#6b5a68">quando o status vira done</text>

  <rect x="385" y="95" width="300" height="120" rx="12" fill="#ffffff" stroke="#d3366a" stroke-width="3"/>
  <text x="535" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#d3366a">BROKER</text>
  <text x="535" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#2b1d29">RabbitMQ</text>
  <text x="535" y="173" text-anchor="middle" font-size="12" fill="#6b5a68">exchange tarefas.eventos (topic)</text>
  <text x="535" y="190" text-anchor="middle" font-size="12" fill="#6b5a68">fila notificacoes.tarefa-concluida</text>

  <rect x="790" y="95" width="160" height="120" rx="12" fill="#ffffff" stroke="#2b1d29" stroke-width="2"/>
  <text x="870" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#d3366a">CONSUMIDOR</text>
  <text x="870" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#2b1d29">notifications</text>
  <text x="870" y="173" text-anchor="middle" font-size="12" fill="#6b5a68">confirma (ack)</text>
  <text x="870" y="190" text-anchor="middle" font-size="12" fill="#6b5a68">e registra no log</text>

  <g fill="none" stroke="#5e4b5a" stroke-width="2.5" marker-end="url(#seta)">
    <path d="M280 155 H383"/><path d="M685 155 H788"/>
  </g>
  <text x="331" y="146" text-anchor="middle" font-size="11" fill="#5e4b5a">publica</text>
  <text x="737" y="146" text-anchor="middle" font-size="11" fill="#5e4b5a">entrega</text>
  <text x="30" y="243" font-size="12" fill="#5e4b5a">A mensagem fica na fila até o consumidor confirmar (ack) e então é removida. Se o consumidor estiver parado, ela espera.</text>

  <line x1="30" y1="285" x2="950" y2="285" stroke="#e1d3cb" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- ============ STREAMING ============ -->
  <text x="30" y="318" font-size="13" font-weight="700" fill="#d3366a">STREAMING · Kafka ou Redpanda · proposta (sem código)</text>
  <rect x="30" y="335" width="250" height="150" rx="12" fill="#ffffff" stroke="#2b1d29" stroke-width="2"/>
  <text x="155" y="365" text-anchor="middle" font-size="11" font-weight="700" fill="#d3366a">PRODUTOR</text>
  <text x="155" y="390" text-anchor="middle" font-size="16" font-weight="700" fill="#2b1d29">tasks-service</text>
  <text x="155" y="413" text-anchor="middle" font-size="12" fill="#6b5a68">acrescenta o evento ao log</text>
  <text x="155" y="430" text-anchor="middle" font-size="12" fill="#6b5a68">do tópico tasks.events</text>
  <text x="155" y="447" text-anchor="middle" font-size="12" fill="#6b5a68">(chave = id da tarefa)</text>

  <rect x="385" y="335" width="300" height="150" rx="12" fill="#ffffff" stroke="#d3366a" stroke-width="3"/>
  <text x="535" y="365" text-anchor="middle" font-size="11" font-weight="700" fill="#d3366a">BROKER (LOG)</text>
  <text x="535" y="390" text-anchor="middle" font-size="16" font-weight="700" fill="#2b1d29">Kafka / Redpanda</text>
  <text x="535" y="413" text-anchor="middle" font-size="12" fill="#6b5a68">tópico tasks.events dividido em partições</text>
  <text x="535" y="430" text-anchor="middle" font-size="12" fill="#6b5a68">eventos retidos por dias (não são</text>
  <text x="535" y="447" text-anchor="middle" font-size="12" fill="#6b5a68">apagados ao serem lidos)</text>

  <rect x="790" y="335" width="160" height="150" rx="12" fill="#ffffff" stroke="#2b1d29" stroke-width="2"/>
  <text x="870" y="365" text-anchor="middle" font-size="11" font-weight="700" fill="#d3366a">CONSUMIDORES</text>
  <text x="870" y="392" text-anchor="middle" font-size="14" font-weight="700" fill="#2b1d29">notifications</text>
  <text x="870" y="414" text-anchor="middle" font-size="14" font-weight="700" fill="#2b1d29">métricas</text>
  <text x="870" y="436" text-anchor="middle" font-size="14" font-weight="700" fill="#2b1d29">auditoria</text>
  <text x="870" y="460" text-anchor="middle" font-size="11" fill="#6b5a68">cada um com seu offset</text>

  <g fill="none" stroke="#5e4b5a" stroke-width="2.5" marker-end="url(#seta)">
    <path d="M280 410 H383"/><path d="M685 410 H788"/>
  </g>
  <text x="331" y="401" text-anchor="middle" font-size="11" fill="#5e4b5a">grava</text>
  <text x="737" y="401" text-anchor="middle" font-size="11" fill="#5e4b5a">lê (puxa)</text>
  <text x="30" y="513" font-size="12" fill="#5e4b5a">O evento continua no log depois de lido: vários consumidores leem o mesmo evento de forma independente e é possível reler o histórico (replay).</text>

  <text x="30" y="575" font-size="12" fill="#5e4b5a">Resumo: mensageria entrega uma tarefa a um consumidor e a descarta; streaming guarda uma história de eventos que muitos consumidores podem ler e reler.</text>
</svg>
