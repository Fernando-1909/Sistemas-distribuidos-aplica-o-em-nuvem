# Orquestra o sistema inteiro: 3 microsserviços + 3 bancos PostgreSQL + frontend
# + RabbitMQ (broker) e o consumidor de eventos (Módulo 4).
#   docker compose up --build -d     (sobe tudo)
#   docker compose down              (para; os DADOS ficam nos volumes)
#   docker compose down -v           (para e APAGA os dados)
name: tarefas

x-django-env: &django-env
  DEBUG: "False"
  SECRET_KEY: ${SECRET_KEY:-chave-apenas-para-desenvolvimento-local-troque-em-producao}
  # O frontend é aberto no navegador em http://localhost:4200
  CORS_ALLOWED_ORIGINS: http://localhost:4200,http://127.0.0.1:4200

services:
  # ------------------------------ users ------------------------------------
  users-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: users
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD:-users_dev}
    volumes:
      - users_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  users:
    build: ./services/users
    image: tarefas/users:latest
    restart: unless-stopped
    depends_on:
      users-db:
        condition: service_healthy
    environment:
      <<: *django-env
      DATABASE_URL: postgresql://users:${USERS_DB_PASSWORD:-users_dev}@users-db:5432/users_db
      ALLOWED_HOSTS: localhost,127.0.0.1,users
    ports:
      - "8001:8000"

  # ----------------------------- projects ----------------------------------
  projects-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: projects_db
      POSTGRES_USER: projects
      POSTGRES_PASSWORD: ${PROJECTS_DB_PASSWORD:-projects_dev}
    volumes:
      - projects_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  projects:
    build: ./services/projects
    image: tarefas/projects:latest
    restart: unless-stopped
    depends_on:
      projects-db:
        condition: service_healthy
    environment:
      <<: *django-env
      DATABASE_URL: postgresql://projects:${PROJECTS_DB_PASSWORD:-projects_dev}@projects-db:5432/projects_db
      ALLOWED_HOSTS: localhost,127.0.0.1,projects
    ports:
      - "8002:8000"

  # ------------------------------ tasks ------------------------------------
  tasks-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tasks_db
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: ${TASKS_DB_PASSWORD:-tasks_dev}
    volumes:
      - tasks_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  tasks:
    build: ./services/tasks
    image: tarefas/tasks:latest
    restart: unless-stopped
    depends_on:
      tasks-db:
        condition: service_healthy
      users:
        condition: service_healthy
      projects:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *django-env
      DATABASE_URL: postgresql://tasks:${TASKS_DB_PASSWORD:-tasks_dev}@tasks-db:5432/tasks_db
      ALLOWED_HOSTS: localhost,127.0.0.1,tasks
      # Dentro da rede do Compose os serviços se encontram pelo NOME do serviço
      USERS_SERVICE_URL: http://users:8000
      PROJECTS_SERVICE_URL: http://projects:8000
      SERVICE_TIMEOUT: "5"
      # Módulo 4: o tasks-service PUBLICA o evento "tarefa concluída" no RabbitMQ
      RABBITMQ_URL: amqp://tarefas:${RABBITMQ_PASSWORD:-tarefas_dev}@rabbitmq:5672/%2F
    ports:
      - "8000:8000"

  # ----------------------------- mensageria --------------------------------
  # Broker de mensagens (imagem oficial rabbitmq com o painel de administração)
  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq   # nome fixo do nó: sem isso o volume não reaproveita os dados após o down/up
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: tarefas
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-tarefas_dev}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "15672:15672"   # painel de administração: http://localhost:15672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # Consumidor: recebe o evento "tarefa concluída" e confirma o recebimento no log
  notifications:
    build: ./services/notifications
    image: tarefas/notifications:latest
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_URL: amqp://tarefas:${RABBITMQ_PASSWORD:-tarefas_dev}@rabbitmq:5672/%2F

  # ----------------------------- frontend ----------------------------------
  frontend:
    build:
      context: ./frontend
      args:
        # Endereços que o NAVEGADOR usa para chamar as APIs (portas publicadas no host)
        TASKS_API_URL: http://localhost:8000/api
        USERS_API_URL: http://localhost:8001/api
        PROJECTS_API_URL: http://localhost:8002/api
    image: tarefas/frontend:latest
    restart: unless-stopped
    depends_on:
      - tasks
    ports:
      - "4200:80"

# Volumes nomeados: os dados dos bancos sobrevivem a "docker compose down".
volumes:
  users_data:
  projects_data:
  tasks_data:
  rabbitmq_data:
