# Atalho opcional: cria os 4 servicos de uma vez (Render > New > Blueprint).
# Os servicos web usam o plano gratuito (nao pede cartao).
# O passo a passo manual esta no README.md.
services:
  - type: web
    name: tarefas-users
    runtime: python
    plan: free
    rootDir: services/users
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --workers 2
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: tarefas-projects
    runtime: python
    plan: free
    rootDir: services/projects
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --workers 2
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: tarefas-api
    runtime: python
    plan: free
    rootDir: services/tasks
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --workers 2 --timeout 60
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: USERS_SERVICE_URL
        sync: false
      - key: PROJECTS_SERVICE_URL
        sync: false
      - key: SERVICE_TIMEOUT
        value: "10"

  - type: web
    name: tarefas-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/frontend/browser
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: TASKS_API_URL
        sync: false
      - key: USERS_API_URL
        sync: false
      - key: PROJECTS_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
